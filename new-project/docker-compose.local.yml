version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: knowledge-tree-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: knowledge_tree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - knowledge-tree-network

  backend:
    image: python:3.11-slim
    container_name: knowledge-tree-backend
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/knowledge_tree
      SECRET_KEY: dev-secret-key-local-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    networks:
      - knowledge-tree-network
    command: |
      bash -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:18-alpine
    container_name: knowledge-tree-frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_DEV_PORT: 5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - knowledge-tree-network
    command: |
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  knowledge-tree-network:
    driver: bridge

volumes:
  postgres_data: