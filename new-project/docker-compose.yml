version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: knowledge-tree-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: knowledge_tree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - knowledge-tree-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge-tree-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/knowledge_tree
      SECRET_KEY: your-secret-key-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - knowledge-tree-network
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-tree-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - knowledge-tree-network

networks:
  knowledge-tree-network:
    driver: bridge

volumes:
  postgres_data: